name: Build Desktop Client

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: singbox-windows
          path: |
            client/src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: ignore

      - name: Publish release
        shell: bash
        run: |
          EXE=$(find client/src-tauri/target -name "*.exe" -path "*/nsis/*" | head -1)
          if [ -z "$EXE" ]; then echo "No NSIS exe found"; exit 1; fi
          TAG="${GITHUB_REF_NAME:-latest}"
          cp "$EXE" "singbox-setup-${TAG}.exe"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "singbox-setup-${TAG}.exe" \
            --title "singbox $TAG" \
            --notes "Windows desktop client $TAG" \
            --latest
          cp "singbox-setup-${TAG}.exe" singbox-setup.exe
          gh release upload "$TAG" singbox-setup.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
