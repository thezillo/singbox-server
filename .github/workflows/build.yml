name: Build Desktop Client

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
            artifact: singbox-windows
          - os: macos-latest
            name: macos-arm64
            artifact: singbox-macos-arm64
          - os: macos-13
            name: macos-x64
            artifact: singbox-macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client

      - name: Upload Windows artifact
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: client/src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: ignore

      - name: Upload macOS artifact
        if: startsWith(matrix.name, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: client/src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME:-latest}"

          EXE=$(find artifacts/singbox-windows -name "*.exe" 2>/dev/null | head -1)
          DMG_ARM=$(find artifacts/singbox-macos-arm64 -name "*.dmg" 2>/dev/null | head -1)
          DMG_X64=$(find artifacts/singbox-macos-x64 -name "*.dmg" 2>/dev/null | head -1)

          FILES=""
          [ -n "$EXE" ] && cp "$EXE" singbox-setup.exe && FILES="$FILES singbox-setup.exe"
          [ -n "$DMG_ARM" ] && cp "$DMG_ARM" singbox-arm64.dmg && FILES="$FILES singbox-arm64.dmg"
          [ -n "$DMG_X64" ] && cp "$DMG_X64" singbox-x64.dmg && FILES="$FILES singbox-x64.dmg"

          if [ -z "$FILES" ]; then echo "No artifacts found"; exit 1; fi

          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" $FILES \
            --repo "$GITHUB_REPOSITORY" \
            --title "singbox $TAG" \
            --notes "Desktop client $TAG" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
