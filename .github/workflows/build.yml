name: Build Desktop Client

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ''
          - os: macos-latest
            name: macos
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: client
          args: ${{ matrix.args }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p collected
          if [ "${{ matrix.name }}" = "windows" ]; then
            find client/src-tauri/target -name "*.exe" -path "*/nsis/*" -exec cp {} collected/singbox-setup.exe \;
          fi
          if [ "${{ matrix.name }}" = "macos" ]; then
            find client/src-tauri/target -name "*.dmg" -exec cp {} collected/singbox-macos.dmg \;
          fi
          ls -la collected/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: singbox-${{ matrix.name }}
          path: collected/
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="latest"; fi

          FILES=""
          for f in artifacts/singbox-windows/* artifacts/singbox-macos/*; do
            [ -f "$f" ] && FILES="$FILES $f"
          done

          if [ -z "$FILES" ]; then echo "No artifacts found"; exit 1; fi

          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" $FILES \
            --repo "$GITHUB_REPOSITORY" \
            --title "singbox $TAG" \
            --notes "Desktop client $TAG" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
