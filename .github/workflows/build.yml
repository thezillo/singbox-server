name: Build Desktop Client

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ''
          - os: macos-latest
            name: macos
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: client
          args: ${{ matrix.args }}

      - name: Upload Windows artifact
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: singbox-windows
          path: client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore

      - name: Upload macOS artifact
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: singbox-macos
          path: client/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="latest"; fi

          EXE=$(find artifacts/singbox-windows -name "*.exe" 2>/dev/null | head -1 || true)
          DMG=$(find artifacts/singbox-macos -name "*.dmg" 2>/dev/null | head -1 || true)

          FILES=""
          if [ -n "$EXE" ]; then cp "$EXE" singbox-setup.exe && FILES="$FILES singbox-setup.exe"; fi
          if [ -n "$DMG" ]; then cp "$DMG" singbox-macos.dmg && FILES="$FILES singbox-macos.dmg"; fi

          if [ -z "$FILES" ]; then echo "No artifacts found"; exit 1; fi

          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" $FILES \
            --repo "$GITHUB_REPOSITORY" \
            --title "singbox $TAG" \
            --notes "Desktop client $TAG" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
